name: Sync LeetCode submissions

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 6" # Saturdays at 08:00 UTC

permissions:
  contents: write

concurrency:
  group: glsync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check LeetCode session
        env:
          LC_COOKIE: ${{ secrets.LEETCODE_SESSION }}
        run: |
          if [ -z "$LC_COOKIE" ]; then
            echo "::error::Add the LEETCODE_SESSION repository secret before running this workflow."
            exit 1
          fi

      - name: Check out glsync
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ahmed-e-abdulaziz/glsync
          ref: cc38f1fd8e95750fca9365bdc264974ac9e8f7c6
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: stable
          cache: false

      - name: Install glsync
        run: |
          # Use conventional commit titles for the imported submissions.
          sed -i 's/Code challenge submission for question:/feat(leetcode): sync solution for question:/g' handler/handler.go
          go install .

      - name: Sync submissions
        env:
          LC_COOKIE: ${{ secrets.LEETCODE_SESSION }}
          GH_TOKEN: ${{ github.token }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          gh auth setup-git --hostname github.com
          git config --global user.name "Marten"
          git config --global user.email "76761713+martenmatrix@users.noreply.github.com"
          # glsync manages its own clone; keep it outside the checked-out tool.
          cd "$(mktemp -d "$RUNNER_TEMP/glsync.XXXXXX")"
          glsync -lc-cookie="$LC_COOKIE" -repo-url="$REPO_URL"
